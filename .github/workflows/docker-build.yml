name: Reusable - Docker Build

on:
  workflow_call:
    inputs:
      docker-context:
        description: Docker build context in the caller repository
        required: false
        type: string
        default: "app"

      image-name:
        description: Local CI image name
        required: false
        type: string
        default: "python-automation-ci"

    outputs:
      status:
        description: Docker build result
        value: ${{ jobs.docker-build.outputs.status }}

permissions:
  contents: read

jobs:
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest

    outputs:
      status: ${{ steps.docker-result.outputs.status }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Create report directory
        shell: bash
        run: |
          mkdir -p reports

      - name: Build Docker image
        id: docker
        shell: bash
        continue-on-error: true
        run: |
          set +e

          docker build \
            -t "${{ inputs.image-name }}:${GITHUB_SHA}" \
            "${{ inputs.docker-context }}" \
            2>&1 | tee reports/docker-build.log

          DOCKER_EXIT_CODE=${PIPESTATUS[0]}

          echo "exit_code=$DOCKER_EXIT_CODE" >> "$GITHUB_OUTPUT"

          exit 0

      - name: Determine Docker build status
        id: docker-result
        if: always()
        shell: bash
        run: |
          EXIT_CODE="${{ steps.docker.outputs.exit_code }}"

          if [ -z "$EXIT_CODE" ]; then
            EXIT_CODE=1
          fi

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Write Docker job summary
        if: always()
        shell: bash
        run: |
          echo "## Docker Build Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.docker-result.outputs.status }}" = "success" ]; then
            echo "**Status:** PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Docker image built successfully." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Status:** FAIL" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Docker build error" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 reports/docker-build.log >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Docker build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-logs-${{ github.run_id }}
          path: reports/docker-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail job when Docker build failed
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.docker-result.outputs.status }}" != "success" ]; then
            echo "Docker build failed."
            exit 1
          fi

          echo "Docker build passed."