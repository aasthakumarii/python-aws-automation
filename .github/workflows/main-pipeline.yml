name: Main CI Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    uses: ./.github/workflows/unit-tests.yml
    with:
      python-version: "3.12"
      requirements-file: requirements-test.txt
      test-path: tests

  syntax-check:
    name: Python Syntax Check
    uses: ./.github/workflows/python-syntax.yml
    with:
      python-version: "3.12"
      source-paths: "app automation tests"

  docker-build:
    name: Docker Build Check
    uses: ./.github/workflows/docker-build.yml
    with:
      docker-context: app
      image-name: python-automation-ci

  deploy:
    name: Deploy After Main Validation

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - unit-tests
      - syntax-check
      - docker-build

    uses: ./.github/workflows/deploy.yml

    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      