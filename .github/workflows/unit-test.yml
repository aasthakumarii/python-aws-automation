name: Reusable - Unit Tests

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used for pytest
        required: false
        type: string
        default: "3.12"

      requirements-file:
        description: Requirements file in the caller repository
        required: false
        type: string
        default: "requirements-test.txt"

      test-path:
        description: Test directory or pytest target in the caller repository
        required: false
        type: string
        default: "tests"

permissions:
  contents: read

jobs:
  unit-tests:
    name: pytest
    runs-on: ubuntu-latest

    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_DEFAULT_REGION: ap-south-1

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.requirements-file }}

      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f "${{ inputs.requirements-file }}" ]; then
            python -m pip install -r "${{ inputs.requirements-file }}"
          fi

          python -m pip install "pytest>=8,<9"

      - name: Run unit tests
        shell: bash
        run: |
          python -m pytest "${{ inputs.test-path }}" -v